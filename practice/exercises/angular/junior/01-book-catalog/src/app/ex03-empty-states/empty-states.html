<section class="catalogue">
  <h2>Estantería</h2>

  <label class="search">
    Buscar por título
    <input type="search" [value]="query()" (input)="onQuery($event)" />
  </label>

  <div class="actions">
    <button type="button" (click)="emptyShelf()">Vaciar estantería</button>
    <button type="button" (click)="restoreShelf()">Restaurar estantería</button>
  </div>

  <!-- Your answer: -->
  <ul>
    @for (book of visible(); track book.id) {
      <li>{{ book.title }} - {{ book.author }}</li>
    } @empty {
      @if (books().length === 0) {
        <li>Todavía no hay libros en la estantería.</li>
      } @else {
        <li>Sin resultados para «{{ query().trim() }}».</li>
      }
    }
  </ul>
</section>

<!-- Por qué @empty solo no distingue los dos casos: -->
<!-- porque solo detecta que visible está vacío, y visible puede estar vacío porque books es un array vacío o porque al filtrar no hay coincidencias. Para saber cuál de los dos es, hay que mirar books(), la lista sin filtrar. -->
