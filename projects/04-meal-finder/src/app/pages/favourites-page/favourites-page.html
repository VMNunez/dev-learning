<div class="container">
  <h1 class="page-title">My Favourites</h1>

  <app-category-filter
    [categories]="allCategories()"
    [selected]="selectedCategory()"
    (categorySelected)="onSelectedCategory($event)"
  />

  <div class="favourites-container">
    @for (favourite of filteredFavourites(); track favourite.idMeal) {
      <app-meal-card
        [meal]="favourite"
        [isFavourite]="true"
        (favouriteToggled)="toggleFavourite($event)"
      />
    } @empty {
      <p class="empty-message">No favourites found.</p>
    }
  </div>
</div>
