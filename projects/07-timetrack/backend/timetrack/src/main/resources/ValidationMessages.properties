# User-facing text for the Bean Validation constraints the request DTOs use. Without this file
# Hibernate Validator falls back to its own lower-case defaults ("must not be blank"), while every
# message a service throws is a capitalised sentence, so one fieldErrors slot read in two styles.
jakarta.validation.constraints.NotBlank.message=Must not be blank
jakarta.validation.constraints.NotNull.message=This field is required
jakarta.validation.constraints.Email.message=Must be a valid email address
jakarta.validation.constraints.Size.message=${min == 0 ? 'Must be at most ' += max += ' characters' : 'Must be between ' += min += ' and ' += max += ' characters'}
jakarta.validation.constraints.DecimalMin.message=Must be at least {value}
jakarta.validation.constraints.DecimalMax.message=Must be at most {value}
jakarta.validation.constraints.Digits.message=Must have at most {integer} whole digits and {fraction} decimal places
