<div class="container">
  <div class="header">
    <h1>Expense Tracker</h1>
    <a routerLink="/add" class="btn-add">+ Add transaction</a>
  </div>

  <div class="summary">
    <app-summary-card
      label="Balance"
      [amount]="balance()"
      [tone]="balance() >= 0 ? 'income' : 'expense'"
    />
    <app-summary-card label="Incomes" [amount]="totalIncome()" tone="income" prefix="+" />
    <app-summary-card label="Expenses" [amount]="totalExpense()" tone="expense" prefix="-" />
  </div>

  <app-filter-bar [current]="currentFilter()" (filterChange)="currentFilter.set($event)" />

  <app-transaction-list
    [transactions]="filteredTransactions()"
    (deleteTransaction)="onDeleteTransaction($event)"
  />
</div>
